[build-system]
requires = ["setuptools >= 77.0.3", "wheel", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-pkg"
dynamic = ["version"]
description ="Simple packaging demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pytest",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/UWSEDS/simple_pkg"

[tool.setuptools_scm]
